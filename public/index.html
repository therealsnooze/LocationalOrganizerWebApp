<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locational Organizer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232f6f4f' d='M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Locational Organizer</span>
    </div>
    <form id="search-form" class="search" role="search" autocomplete="off">
      <input id="search-input" type="search" placeholder="Search an address or place" aria-label="Search an address or place" maxlength="200">
      <button type="submit" class="btn btn-primary">Search</button>
      <ul id="search-results" class="search-results" hidden></ul>
    </form>
    <div id="account" class="account" hidden>
      <span id="account-name" class="account-name"></span>
      <button id="logout-button" type="button" class="btn btn-small">Log out</button>
    </div>
  </header>

  <main class="layout">
    <div id="map" class="map" aria-label="Map"></div>
    <aside id="panel" class="panel" aria-live="polite"></aside>
  </main>

  <div id="auth" class="auth" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
